name: WhatsApp Alertas SLA (30 min)

# Roda pelo GitHub Actions porque o plano Hobby da Vercel só aceita
# cron diário; um cron a cada 15 min no vercel.json faz o deploy falhar.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  checar-sla:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de alertas
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_TOKEN }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/whatsapp-alertas-check?tipo=sla_30min")
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d':' -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Falhou com HTTP $HTTP_CODE"
            exit 1
          fi
